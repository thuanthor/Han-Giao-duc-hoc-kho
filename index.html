<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập trắc nghiệm – Giáo dục học</title>
<style>
  :root{
    --bg:#f3f7fb; --card:#ffffff; --ink:#26364a; --muted:#6b7c93;
    --primary:#4a7fd4; --primary-soft:#e6efff; --line:#dbe5f0;
    --ok:#2e9d6b; --ok-bg:#e3f6ec; --bad:#d9534f; --bad-bg:#fdeaea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55}
  header{background:linear-gradient(135deg,#4a7fd4,#6aa5e8);color:#fff;padding:28px 16px 22px;text-align:center}
  header h1{margin:0 0 6px;font-size:1.55rem}
  header p{margin:0;opacity:.92;font-size:.95rem}
  .bar{position:sticky;top:0;z-index:10;background:rgba(243,247,251,.95);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:10px 16px}
  .bar-inner{max-width:1080px;margin:auto}
  .stats{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;font-size:.92rem}
  .stats b{font-size:1.02rem}
  .ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
  .progress{height:8px;background:#dfe8f3;border-radius:99px;margin-top:8px;overflow:hidden}
  .progress>div{height:100%;width:0;background:var(--primary);transition:width .3s}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid var(--primary);background:#fff;color:var(--primary);padding:6px 14px;border-radius:8px;font-size:.88rem}
  .btn:hover{background:var(--primary-soft)}
  .btn.main{background:var(--primary);color:#fff}
  .btn.main:hover{background:#3b6dbd}
  main{max-width:1080px;margin:18px auto 60px;padding:0 14px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
  .content{min-width:0}
  .nav{position:sticky;top:calc(var(--barh,90px) + 14px);display:flex;flex-wrap:wrap;gap:6px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px;max-height:calc(100vh - var(--barh,90px) - 28px);overflow:auto}
  .nav a{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:.82rem;
    text-decoration:none;color:var(--ink);background:#eef3f9;border:1px solid transparent}
  .nav a.ok{background:var(--ok-bg);color:var(--ok);border-color:#b8e4cf}
  .nav a.bad{background:var(--bad-bg);color:var(--bad);border-color:#f3c4c2}
  .nav a.cur{outline:2px solid var(--primary);outline-offset:1px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 12px;
    margin-bottom:14px;box-shadow:0 1px 3px rgba(40,70,110,.05);scroll-margin-top:calc(var(--barh,90px) + 14px)}
  .q h3{margin:0 0 12px;font-size:1.02rem;font-weight:600}
  .q h3 span{color:var(--primary)}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f8fafd;
    border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;color:var(--ink);transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:#e3ebf6;display:grid;place-items:center;
    font-weight:600;font-size:.82rem;color:#456}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok)}
  .opt.correct .k{background:var(--ok);color:#fff}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .fb{font-size:.88rem;margin:2px 0 6px;min-height:1px}
  .result{display:none;background:var(--card);border:2px solid var(--primary);border-radius:14px;
    padding:20px;text-align:center;margin-top:20px}
  .result h2{margin:0 0 6px;color:var(--primary)}
  .tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
  .tab{flex:1 1 0;min-width:96px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 10px;border-radius:10px;
    font-weight:600;font-size:.92rem;white-space:nowrap;transition:.15s}
  .tab small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
  .tab:hover{border-color:var(--primary);background:var(--primary-soft)}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .tab.active small{color:#e6efff}
  .tab.full:not(.active){border-color:#b8e4cf;background:var(--ok-bg);color:var(--ok)}
  body.weak{--primary:#d9822b;--primary-soft:#fff1de}
  body.weak header{background:linear-gradient(135deg,#d9822b,#f0a85a)}
  .topline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .modes{display:flex;gap:6px}
  .mode{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:99px;font-size:.88rem;font-weight:600}
  .mode:hover{border-color:var(--primary);background:var(--primary-soft)}
  .mode.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;background:#fff1de;color:#b5661a;font-size:.78rem;text-align:center}
  .mode.active .badge{background:#fff;color:var(--primary)}
  .auto{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  .acts{display:flex;justify-content:flex-end;margin:0 0 6px}
  .star,.del{border:1px dashed #e0b27a;background:#fffaf2;color:#b5661a;padding:5px 12px;border-radius:8px;font-size:.84rem}
  .star:hover,.del:hover{background:#fff1de}
  .star.on{border-style:solid;background:#fff1de;font-weight:600}
  .del{border-color:#b8e4cf;background:var(--ok-bg);color:var(--ok)}
  .del:hover{background:#d3f0e1}
  .tag{color:var(--muted);font-weight:400}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:2rem;margin-bottom:6px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding-bottom:24px}
  @media(max-width:860px){
    main{display:block}
    .nav{top:var(--barh,90px);z-index:9;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;
      border-radius:0 0 12px 12px;margin:0 0 14px;padding:8px 10px}
    .nav a{flex:none}
    .q{scroll-margin-top:calc(var(--barh,90px) + 60px)}
  }
  @media(max-width:520px){header h1{font-size:1.25rem}.q{padding:14px 12px 8px}}
</style>
</head>
<body>
<header>
  <h1>📘 Ôn tập trắc nghiệm</h1>
  <p id="sub"></p>
</header>

<div class="bar"><div class="bar-inner">
  <div class="topline">
    <div class="modes"><button class="mode" id="mode-quiz"></button><button class="mode" id="mode-weak"></button></div>
    <label class="auto"><input type="checkbox" id="auto"> Tự lưu câu làm sai</label>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stats">
    <div>Đã làm: <b id="done">0</b>/<b id="total">0</b> &nbsp;·&nbsp;
      <span class="ok-t">Đúng: <b id="right">0</b></span> &nbsp;·&nbsp;
      <span class="bad-t">Sai: <b id="wrong">0</b></span></div>
    <div class="btns">
      <button class="btn" id="shuffle">🔀 Xáo trộn</button>
      <button class="btn main" id="reset">↺ Làm lại</button>
    </div>
  </div>
  <div class="progress"><div id="pbar"></div></div>
</div></div>

<main>
  <div class="nav" id="nav"></div>
  <div class="content"><div id="list"></div>
  <div class="result" id="result">
    <h2 id="rtitle"></h2>
    <p id="rtext"></p>
    <button class="btn main" onclick="resetQuiz(false)">Làm lại từ đầu</button>
  </div></div>
</main>
<footer>Chọn một đáp án để xem đúng/sai ngay lập tức · Bấm ☆ để lưu câu hay nhầm vào mục “Câu hay sai”.</footer>

i đa lượng kiến thức cho người học", "Tạo ra lợi nhuận kinh tế trực tiếp", "Đào tạo người học thi đỗ vào cấp học cao hơn", "Hình thành và phát triển toàn diện nhân cách cho người học"], "a": 3}, {"q": "Câu \"Nghề dạy học là một nghề sáng tạo bậc nhất vì nó sáng tạo ra những con người sáng tạo\" là của:", "o": ["Hồ Chí Minh", "Phạm Văn Đồng", "Lê Duẩn", "Cômenxki"], "a": 1}, {"q": "Đối tượng của hoạt động sư phạm là:", "o": ["Chương trình và sách giáo khoa", "Cơ sở vật chất của nhà trường", "Người học, thế hệ trẻ đang trong giai đoạn hình thành và phát triển nhân cách", "Đội ngũ giáo viên"], "a": 2}, {"q": "Công cụ quan trọng nhất, chủ yếu nhất của hoạt động sư phạm là:", "o": ["Nhân cách của người giáo viên", "Sách giáo khoa", "Thiết bị công nghệ dạy học", "Phòng học và đồ dùng dạy học"], "a": 0}, {"q": "Sản phẩm của hoạt động sư phạm là:", "o": ["Điểm số và thành tích của học sinh", "Giáo án và tài liệu giảng dạy", "Số lượng học sinh tốt nghiệp", "Nhân cách toàn diện của người học"], "a": 3}, {"q": "Việc đánh giá chất lượng và hiệu quả của hoạt động sư phạm khó khăn, lâu dài vì:", "o": ["Giáo viên không muốn bị đánh giá", "Sản phẩm của hoạt động sư phạm có tính chất đặc thù, không phải sản phẩm vật chất trực tiếp", "Chưa có quy định về đánh giá giáo viên", "Học sinh không hợp tác khi đánh giá"], "a": 1}, {"q": "Nhà sư phạm V. A. Xu-khôm-lin-xki cho rằng lao động của người giáo viên:", "o": ["Dễ đánh giá nhất trong các loại lao động", "Cho kết quả ngay sau một học kì", "Có sai lầm và thất bại dẫn đến hậu quả nặng nề như không lao động nào khác", "Không cần thời gian dài mới thấy kết quả"], "a": 2}, {"q": "Môi trường sư phạm là môi trường:", "o": ["Được chọn lựa, xây dựng có mục đích sư phạm, không chỉ ở trường học mà cả ở gia đình và cộng đồng", "Chỉ gồm phòng học và trang thiết bị", "Hoàn toàn tự nhiên, không có sự tác động của giáo viên", "Chỉ tồn tại trong nhà trường"], "a": 0}, {"q": "Hoạt động sư phạm là một dạng hoạt động có tính chất:", "o": ["Chỉ mang tính khoa học", "Chỉ mang tính nghệ thuật", "Chỉ mang tính kĩ thuật", "Vừa mang tính khoa học, vừa mang tính nghệ thuật cao"], "a": 3}, {"q": "Theo Điều 67 Luật Giáo dục 2019, nhà giáo phải có tiêu chuẩn nào sau đây?", "o": ["Có học vị tiến sĩ trở lên", "Có phẩm chất, tư tưởng, đạo đức tốt", "Có thâm niên công tác tối thiểu 10 năm", "Có kinh nghiệm quản lí giáo dục"], "a": 1}, {"q": "Phẩm chất nghề nghiệp của giáo viên phổ thông là:", "o": ["Khả năng thiết kế kế hoạch dạy học", "Khả năng nghiên cứu khoa học sư phạm", "Tư tưởng, đạo đức, lối sống của giáo viên trong thực hiện nhiệm vụ dạy học, giáo dục", "Khả năng sử dụng công nghệ thông tin"], "a": 2}, {"q": "Nhóm năng lực \"tìm hiểu và nắm vững đặc điểm học sinh\" bao gồm:", "o": ["Thu thập và xử lí thông tin về học sinh", "Thiết kế kế hoạch dạy học", "Lập đề cương nghiên cứu", "Phối hợp các lực lượng giáo dục"], "a": 0}, {"q": "Nhóm năng lực \"tổ chức dạy học và giáo dục\" bao gồm:", "o": ["Phát hiện vấn đề nghiên cứu", "Giao tiếp, tham vấn, tư vấn", "Phát triển kĩ năng sống", "Thiết kế kế hoạch, tổ chức hoạt động và đánh giá kết quả dạy học, giáo dục"], "a": 3}, {"q": "Nhóm năng lực \"nghiên cứu khoa học sư phạm ứng dụng\" bao gồm:", "o": ["Xử lí tình huống giáo dục", "Phát hiện vấn đề nghiên cứu; lập đề cương, kế hoạch; tổ chức nghiên cứu; trình bày, công bố kết quả", "Phối hợp giữa nhà trường và gia đình", "Tự học, tự bồi dưỡng chuyên môn"], "a": 1}, {"q": "Nhóm năng lực \"hoạt động xã hội\" của giáo viên bao gồm:", "o": ["Lập kế hoạch tìm hiểu học sinh", "Đánh giá kết quả học tập của học sinh", "Phối hợp các lực lượng giáo dục; giao tiếp, tham vấn, tư vấn; xử lí tình huống giáo dục", "Ứng dụng công nghệ thông tin trong dạy học"], "a": 2}, {"q": "Trình độ chuẩn được đào tạo của giáo viên tiểu học theo Điều lệ trường tiểu học (2020) là:", "o": ["Cử nhân ngành đào tạo giáo viên tiểu học hoặc cử nhân chuyên ngành phù hợp và chứng chỉ bồi dưỡng nghiệp vụ sư phạm giáo dục tiểu học", "Tốt nghiệp trung học phổ thông", "Thạc n tài, giữ gìn bản sắc văn hoá dân tộc"], "a": 0}, {"q": "Mặt bằng dân trí được thể hiện bằng:", "o": ["Thu nhập bình quân đầu người của người dân một nước", "Số lượng trường đại học trên một triệu dân của một nước", "Số lượng sách được xuất bản hằng năm tính theo đầu người", "Số năm học trung bình của người dân một nước ở một thời điểm nhất định"], "a": 3}, {"q": "Cấu trúc 4 tầng của “tài” theo giáo trình là:", "o": ["Khiếu – năng lực – tài năng – thiên tài", "Năng lực – kĩ năng – tri thức – thái độ", "Tri thức – kĩ năng – thái độ – hành vi", "Tư chất – năng khiếu – năng lực – tài năng"], "a": 0}, {"q": "Trong phát hiện và bồi dưỡng nhân tài, giai đoạn phát hiện, đào tạo nhân tài chủ yếu dựa vào:", "o": ["Xã hội là chính, gia đình và nhà trường chỉ giữ vai trò hỗ trợ", "Gia đình và nhà trường, những nơi giữ vai trò quan trọng", "Doanh nghiệp là chính, thông qua đào tạo gắn với thực tiễn", "Cơ quan nhà nước là chính, thông qua chính sách và đầu tư"], "a": 1}, {"q": "Ba mục tiêu nâng cao dân trí, đào tạo nhân lực, bồi dưỡng nhân tài có quan hệ:", "o": ["Đối lập nhau, nên phải ưu tiên một mục tiêu trong từng giai đoạn", "Độc lập nhau, mỗi mục tiêu thực hiện riêng ở từng bậc học", "Thay thế nhau, hoàn thành mục tiêu này thì chuyển sang mục tiêu khác", "Thống nhất biện chứng, tác động qua lại, cần thực hiện đồng thời"], "a": 3}, {"q": "Các phẩm chất chung chủ yếu của học sinh trong Chương trình giáo dục phổ thông 2018 gồm:", "o": ["Yêu nước, nhân ái, chăm chỉ, trung thực, trách nhiệm", "Tự chủ, giao tiếp, sáng tạo, hợp tác, giải quyết vấn đề", "Đạo đức, trí tuệ, thể chất, thẩm mĩ, lao động", "Yêu nước, nhân ái, chăm chỉ, kỉ luật, sáng tạo"], "a": 0}, {"q": "Các năng lực chung cốt lõi của học sinh trong Chương trình giáo dục phổ thông 2018 gồm:", "o": ["Yêu nước, nhân ái, chăm chỉ; trung thực, trách nhiệm", "Tự chủ và tự học; giao tiếp và hợp tác; giải quyết vấn đề và sáng tạo", "Tính toán, ngôn ngữ, thể chất, thẩm mĩ, tin học", "Tự chủ và tự học; giao tiếp và hợp tác; tính toán và ngôn ngữ"], "a": 1}, {"q": "Năng lực là thuộc tính cá nhân được hình thành, phát triển nhờ:", "o": ["Tố chất sẵn có, được bộc lộ tự nhiên theo độ tuổi", "Quá trình học tập, tích luỹ kiến thức ở nhà trường", "Tố chất sẵn có và quá trình học tập, rèn luyện", "Môi trường gia đình và sự định hướng của cha mẹ"], "a": 2}, {"q": "Kĩ năng sống là:", "o": ["Kĩ năng nghề nghiệp chuyên sâu giúp cá nhân lập nghiệp và thăng tiến", "Kĩ năng sử dụng máy móc, công nghệ trong học tập và sinh hoạt", "Kĩ năng làm bài, ghi nhớ và ứng phó với thi cử, kiểm tra", "Năng lực, hành vi thích ứng, tích cực giúp ứng xử hiệu quả trước thách thức của cuộc sống"], "a": 3}], "3": [{"q": "Các tổ chức, đoàn thể trong nhà trường phổ thông (Công đoàn, Đoàn Thanh niên Cộng sản Hồ Chí Minh, Đội Thiếu niên Tiền phong Hồ Chí Minh...) hoạt động nhằm:", "o": ["Hỗ trợ hiệu trưởng điều hành và quyết định các hoạt động chuyên môn của nhà trường", "Giám sát việc quản lí tài chính và tài sản của nhà trường theo quy định", "Giúp nhà trường thực hiện mục tiêu, nguyên lí giáo dục theo quy định của pháp luật", "Phối hợp với các tổ chuyên môn xây dựng kế hoạch giáo dục của nhà trường"], "a": 2}, {"q": "Mỗi lớp học có không quá bao nhiêu học sinh ở tiểu học và trung học?", "o": ["30 ở tiểu học và 40 ở trung học", "40 ở tiểu học và 50 ở trung học", "35 ở tiểu học và 45 ở trung học", "35 ở tiểu học và 40 ở trung học"], "a": 2}, {"q": "Lớp trưởng và lớp phó do tập thể học sinh bầu ra:", "o": ["Vào đầu mỗi học kì; học sinh đảm nhận không quá 2 học kì trong một cấp học", "Vào đầu năm học; học sinh đảm nhận không quá 2 năm học trong một cấp học", "Vào đầu mỗi học kì; học sinh có thể đảm nhận liên tục trong cả cấp học", "Vào cuối năm học; học sinh đảm nhận không quá 2 học kì trong một cấp học"], "a": 0}, {"q": "Tổ chức học tập cơ sở ở trường phổ thông, nơi chủ yếu diễn ra các hoạt động học tập và rèn luyện nhân cách của học sinh là:", "o": ["Tổ học sinh", "Lớp học", "Câu lạc bộ", "Đội Cờ đỏ"], "a": 1}, {"q": "Đơn vị cơ sở của lớp, giúp học sinh học tập, rèn luyện theo yêu cầu chung của lớp là:", "o": ["Nhóm văn nghệ", "Câu lạc bộ", "Tổ học sinh", "Khối lớp"], "a": 2}, {"q": "Hoạt động giáo dục ở nhà trường phổ thông được hiểu là hoạt động:", "o": ["Tương tác một chiều từ hoạt động chủ đạo của nhà giáo dục đến hoạt động tiếp nhận của học sinh", "Tương tác, biện chứng, thống nhất giữa hoạt động chủ đạo của nhà giáo dục và hoạt động tự giác, tích cực, chủ động của học sinh", "Tương tác, biện chứng giữa hoạt động tự giáo dục của học sinh và tác động tự phát của môi trường xã hội", "Thống nhất giữa hoạt động dạy của giáo viên và hoạt động học của học sinh trong phạm vi lớp học"], "a": 1}, {"q": "Hoạt động chủ đạo của nhà giáo dục thể hiện ở:", "o": ["Định hướng, tổ chức và thực hiện thay học sinh những nhiệm vụ khó trong học tập, rèn luyện", "Truyền đạt hệ thống kiến thức, kĩ năng theo chương trình để học sinh ghi nhớ, vận dụng", "Định hướng, tổ chức, hướng dẫn, đánh giá và điều chỉnh quá trình học tập, rèn luyện nhân cách của học sinh", "Giám sát, kiểm tra, cho điểm và xếp loại kết quả học tập, rèn luyện của học sinh"], "a": 2}, {"q": "Trong hoạt động giáo dục, học sinh là:", "o": ["Đối tượng tác động sư phạm, tiếp nhận và thực hiện các yêu cầu giáo dục của nhà giáo dục", "Chủ thể học tập, tự quyết định nội dung, mục tiêu và phương pháp giáo dục cho mình", "Người tiếp nhận hệ thống kinh nghiệm xã hội do nhà giáo dục chuyển giao", "Vừa là đối tượng tác động sư phạm của nhà giáo dục vừa là chủ thể học tập, tự giáo dục"], "a": 3}, {"q": "Bản chất chung của giáo dục là:", "o": ["Quá trình hình thành bản chất người, quá trình xã hội hoá con người", "Quá trình truyền đạt kinh nghiệm xã hội từ thế hệ trước sang thế hệ sau theo một chiều", "Quá trình hình thành tri thức khoa học và kĩ năng nghề nghiệp cho con người", "Quá trình phát triển thể chất và tâm lí của con người theo quy luật tự nhiên"], "a": 0}, {"q": "Hoạt động giáo dục phải chuyển hoá được:", "o": ["Nhu cầu chủ quan của học sinh thành các yêu cầu khách quan của xã hội", "Các yêu cầu khách quan của xã hội thành nhu cầu chủ quan của học sinh", "Kết quả học tập của học sinh thành điểm số và xếp loại theo quy chế", "Nội dung chương trình thành thời lượng và kế hoạch dạy học của nhà trường"], "a": 1}, {"q": "Thước đo giá trị đích thực của một người (nhân cách) là:", "o": ["Mức độ nhận thức, hiểu biết về các chuẩn mực xã hội", "Mức độ vững vàng của tình cảm và niềm tin", "Mức độ đúng đắn của hành vi, năng lực", "Số lượng kiến thức và bằng cấp đạt được"], "a": 2}, {"q": "Sự thống nhất biện chứng phản ánh bản chất của hoạt động giáo dục là sự thống nhất giữa:", "o": ["Tác động của giáo viên và tác động của nhà trường đối với học sinh", "Nội dung và hình thức tổ chức hoạt động giáo dục trong nhà trường", "Lí luận và thực tiễn trong tổ chức hoạt động giáo dục ở nhà trường", "Tác động sư phạm của nhà giáo dục (nhà trường – gia đình – xã hội) và hoạt động tự giác, tích cực, chủ động của học sinh"], "a": 3}, {"q": "Đặc điểm nào sau đây KHÔNG phải là đặc điểm của hoạt động giáo dục học sinh?", "o": ["Tính mục đích", "Tính phức hợp, lâu dài và liên tục", "Tính cá biệt", "Tính đồng loạt, áp dụng như nhau cho mọi học sinh"], "a": 3}, {"q": "Mục đích giáo dục (trong đặc điểm tính mục đích) là:", "o": ["Mô hình nhân cách cần hình thành cho học sinh, thể hiện yêu cầu cần đạt về phẩm chất, năng lực phù hợp mỗi giai đoạn phát triển theo từng cấp học", "Hệ thống tri thức, kĩ năng cần trang bị cho học sinh, thể hiện qua các môn học ở từng cấp học", "Kết quả dự kiến sau mỗi bài học, thể hiện yêu cầu về biết, hiểu, vận dụng của học sinh", "Quy định về chuẩn đầu ra và điểm số tối thiểu mà học sinh phải đạt ở mỗi cấp học"], "a": 0}, {"q": "“Lực nhiễu” trong tính phức hợp của hoạt động giáo dục là:", "o": ["Các tác động tích cực, thống nhất từ nhà trường, gia đình, xã hội làm tăng hiệu quả hoạt động giáo dục", "Các tác động tiêu cực, tự phát, mâu thuẫn từ nhà trường, gia đình, xã hội gây khó khăn, thậm chí “vô hiệu hoá” tác động có mục đích của nhà giáo dục", "Sự can thiệp quá mức của phụ huynh vào hoạt động giáo dục của nhà trường đối với học sinh", "Sự thiếu phối hợp giữa các tổ chức Đoàn, Đội với giáo viên trong hoạt động giáo dục"], "a": 1}, {"q": "Sự hình thành và phát triển nhân cách là quá trình:", "o": ["Diễn ra chủ yếu ở tuổi đi học, kết thúc khi học sinh tốt nghiệp phổ thông", "Diễn ra chủ yếu trong nhà trường, dưới sự tổ chức của nhà giáo dục", "Lâu dài, từ khi con người chào đời cho đến cuối đời", "Ngắn hạn, hoàn thành khi con người đến tuổi trưởng thành"], "a": 2}, {"q": "Quá trình giáo dục lại là quá trình:", "o": ["Thuận lợi hơn giáo dục ban đầu, vì học sinh đã có sẵn nền tảng nhận thức và hành vi", "Khó khăn, chủ yếu dựa vào biện pháp xử phạt nghiêm khắc để uốn nắn hành vi sai lệch", "Khó khăn, chủ yếu dựa vào nhắc nhở thường xuyên và sự giám sát của gia đình", "Khó khăn, vừa xoá bỏ cái cũ vừa hình thành cái mới phù hợp hơn, phải lựa chọn phương pháp đặc thù, thích hợp"], "a": 3}, {"q": "Do tính cá biệt, nhà giáo dục cần:", "o": ["Có những tác động riêng phù hợp với từng đối tượng trong từng tình huống cụ thể, tránh giáo dục rập khuôn, máy móc, hình thức", "Áp dụng thống nhất một cách giáo dục đã được kiểm chứng hiệu quả cho mọi học sinh trong lớp", "Tập trung tác động vào nhóm học sinh có kết quả nổi trội để tạo sức lan toả cho tập thể", "Dựa chủ yếu vào đặc điểm chung của lứa tuổi để lựa chọn nội dung và phương pháp phù hợp"], "a": 0}, {"q": "Hoạt động dạy học có chức năng trội là:", "o": ["Tổ chức, hướng dẫn học sinh lĩnh hội hệ thống giá trị, chuẩn mực xã hội, rèn luyện kĩ năng sống", "Tổ chức, hướng dẫn học sinh lĩnh hội hệ thống tri thức khoa học, rèn luyện kĩ năng, kĩ xảo, phát triển năng lực chuyên môn đặc thù trong các môn học", "Tổ chức, hướng dẫn học sinh rèn luyện năng lực tâm lí – xã hội thông qua trải nghiệm thực tiễn", "Tổ chức phong trào thi đua, khen thưởng và đánh giá phẩm chất của học sinh"], "a": 1}, {"q": "Hoạt động trải nghiệm, hướng nghiệp cùng các hoạt động giáo dục khác có chức năng trội là:", "o": ["Tổ chức, hướng dẫn học sinh lĩnh hội hệ thống tri thức khoa học, rèn luyện kĩ năng, kĩ xảo trong các môn học", "Tổ chức, hướng dẫn học sinh tự kiểm tra, đánh giá và điều chỉnh quá trình học tập của mình", "Tổ chức, hướng dẫn học sinh lĩnh hội hệ thống giá trị, chuẩn mực xã hội, rèn luyện kĩ năng sống, phát triển năng lực tâm lí – xã hội", "Tổ chức, hướng dẫn học sinh quản lí lớp học, điều hành các hoạt động tập thể và thi đua"], "a": 2}, {"q": "Hoạt động giáo dục tổng thể gồm các hoạt động bộ phận:", "o": ["Hoạt động dạy học; hoạt động giáo dục, trải nghiệm trong nhà trường; hoạt động tự giáo dục của học sinh", "Hoạt động dạy học; hoạt động ngoại khoá; hoạt động quản lí của nhà trường", "Hoạt động dạy học; hoạt động giáo dục, trải nghiệm; hoạt động xã hội, cộng đồng", "Hoạt động giáo dục của nhà trường; hoạt động giáo dục của gia đình; hoạt động giáo dục của xã hội"], "a": 0}, {"q": "Nguyên tắc giáo dục là:", "o": ["Những quy định có tính bắt buộc về nội dung, hình thức, xử phạt và khen thưởng trong nhà trường", "Những cách thức hoạt động phối hợp giữa nhà giáo dục và học sinh để thực hiện nhiệm vụ giáo dục", "Những cách tổ chức, sắp xếp hoạt động giáo dục theo trật tự và chế độ nhất định", "Những luận điểm có tính quy luật, định hướng việc lựa chọn, vận dụng nội dung, phương thức tổ chức giáo dục, đảm bảo thực hiện nhiệm vụ theo mục tiêu xác định"], "a": 3}, {"q": "Nguyên tắc nào sau đây KHÔNG nằm trong hệ thống nguyên tắc hoạt động giáo dục ở trường phổ thông?", "o": ["Đảm bảo tính mục đích của hoạt động giáo dục", "Đảm bảo tính trực quan, sinh động trong hoạt động giáo dục", "Đảm bảo giáo dục trong tập thể và bằng tập thể", "Đảm bảo tính hệ thống, tính liên tục trong hoạt động giáo dục"], "a": 1}, {"q": "Việc xác định mục đích, mục tiêu giáo dục phải đảm bảo “sợi chỉ đỏ” xuyên suốt, nghĩa là:", "o": ["Nhất quán xuyên suốt các cấp độ mục tiêu, đồng thời linh hoạt với từng đối tượng học sinh và hoàn cảnh cụ thể", "Thống nhất mục tiêu ở mọi cấp độ và áp dụng như nhau cho mọi đối tượng học sinh", "Linh hoạt theo từng đối tượng học sinh và hoàn cảnh, mỗi cấp độ mục tiêu được xác định độc lập", "Xác định mục tiêu cấp học làm chuẩn, các hoạt động cụ thể không cần xác định riêng mục tiêu"], "a": 0}, {"q": "Theo nguyên tắc đảm bảo hoạt động giáo dục gắn với thực tiễn đời sống, hoạt động giáo dục:", "o": ["Diễn ra chủ yếu trong nhà trường, hoạt động ngoài nhà trường chỉ mang tính bổ trợ khi có điều kiện", "Gắn với thực tiễn thông qua sách vở, tài liệu và các bài học minh hoạ trong lớp học", "Gắn với thực tiễn thông qua kiểm tra, thi cử bằng các tình huống thực tế trong cuộc sống", "Không bó hẹp trong nhà trường mà phải mở rộng phạm vi các hoạt động giáo dục ngoài nhà trường"], "a": 3}, {"q": "Trong phối hợp ba lực lượng giáo dục, vai trò chủ đạo thuộc về:", "o": ["Nhà trường; gia đình và xã hội giữ vai trò chủ động phối hợp", "Gia đình; nhà trường và xã hội giữ vai trò chủ động phối hợp", "Xã hội; nhà trường và gia đình giữ vai trò chủ động phối hợp", "Các phương tiện truyền thông; nhà trường và gia đình giữ vai trò hỗ trợ"], "a": 0}, {"q": "Theo nguyên tắc giáo dục trong tập thể và bằng tập thể, tập thể là:", "o": ["Môi trường tập hợp học sinh để tổ chức các hoạt động giáo dục của nhà trường", "Vừa là môi trường, vừa là phương tiện giáo dục hiệu quả nhất đối với học sinh", "Phương tiện kiểm tra, đánh giá kết quả học tập và rèn luyện của học sinh", "Môi trường tổ chức vui chơi, giao lưu và các sinh hoạt ngoài giờ lên lớp"], "a": 1}, {"q": "Khi xây dựng tập thể học sinh, cần:", "o": ["Đặt lợi ích tập thể lên trước, các nguyện vọng cá nhân được xem xét khi có điều kiện", "Tôn trọng lợi ích cá nhân của từng thành viên, lợi ích chung được hình thành tự phát", "Kết hợp hài hoà lợi ích cá nhân và lợi ích tập thể, tránh cực đoan hoá hoặc đối lập hai loại lợi ích", "Đảm bảo lợi ích của đa số thành viên, nguyện vọng của thiểu số được điều chỉnh theo tập thể"], "a": 2}, {"q": "Nhân cách chỉ có thể hình thành và phát triển thông qua:", "o": ["Hoạt động và bằng hoạt động của cá nhân với các tổ chức và cá nhân khác trong xã hội", "Quá trình tự học, tự nghiên cứu và tích luỹ tri thức của cá nhân dưới sự hướng dẫn của giáo viên", "Quá trình tiếp nhận hệ thống tri thức, chuẩn mực do nhà trường truyền thụ có hệ thống", "Sự tác động của di truyền và môi trường sống trong những năm đầu đời"], "a": 0}, {"q": "Theo nguyên tắc tôn trọng nhân cách kết hợp yêu cầu hợp lí đối với học sinh:", "o": ["Càng tôn trọng nhân cách học sinh bao nhiêu, càng nên giảm bớt yêu cầu đối với họ bấy nhiêu", "Càng tôn trọng nhân cách học sinh bao nhiêu, càng phải đưa ra những yêu cầu hợp lí đối với họ bấy nhiêu", "Tôn trọng nhân cách và đề ra yêu cầu hợp lí là hai việc cần thực hiện ở hai giai đoạn riêng", "Càng đề ra yêu cầu cao đối với học sinh thì mức độ tôn trọng nhân cách càng giảm"], "a": 1}, {"q": "Yêu cầu hợp lí đối với học sinh là yêu cầu:", "o": ["Ở mức vừa phải để mọi học sinh đều dễ dàng đạt được và không bị áp lực", "Ở mức cao nhất mà học sinh có thể đạt được để kích thích sự phấn đấu", "Đáp ứng mục tiêu giáo dục; vừa sức; kích thích học sinh tự giác, tích cực; khả thi; có khả năng mang lại hiệu quả mong muốn", "Do giáo viên và phụ huynh thống nhất đề ra dựa trên nguyện vọng của gia đình"], "a": 2}, {"q": "Trong hoạt động giáo dục, nhà giáo dục cần tránh:", "o": ["Nghiêm khắc, kiên quyết với những nhược điểm, sai lầm của học sinh", "Kịp thời động viên, kích thích học sinh phấn đấu vươn lên", "Đề ra yêu cầu ngày càng cao đối với học sinh một cách chân thành", "Thô bạo, khắt khe, thiếu tin tưởng, đồng thời dễ dãi, nuông chiều quá mức đối với học sinh"], "a": 3}, {"q": "Để thực hiện nguyên tắc phù hợp đặc điểm lứa tuổi và đặc điểm cá nhân, nhà giáo dục cần đảm bảo phối hợp giữa:", "o": ["Tính vừa sức chung và tính vừa sức riêng, giữa tính đại trà và tính cá biệt", "Tính khoa học và tính nghệ thuật, giữa tính đại trà và tính hệ thống", "Tính vừa sức chung và tính liên tục, giữa lí thuyết và thực hành", "Tính mục đích và tính thực tiễn, giữa tính cá biệt và tính tập thể"], "a": 0}, {"q": "Nguyên tắc đảm bảo tính hệ thống, tính liên tục đòi hỏi kế hoạch giáo dục thống nhất, nâng dần yêu cầu về phẩm chất và năng lực theo:", "o": ["Đường thẳng đi lên, mỗi cấp học là một giai đoạn tách biệt", "Vòng xoáy ốc – đồng tâm", "Vòng tròn khép kín, nội dung lặp lại ở mỗi cấp học", "Hình tháp, nội dung thu hẹp dần từ khái quát đến chuyên sâu"], "a": 1}, {"q": "Phương pháp giáo dục là:", "o": ["Cách thức hoạt động của nhà giáo dục nhằm truyền đạt nội dung và thực hiện nhiệm vụ giáo dục", "Cách thức hoạt động phối hợp thống nhất của nhà giáo dục và người được giáo dục, tiến hành dưới vai trò chủ đạo của nhà giáo dục nhằm thực hiện nhiệm vụ và mục tiêu giáo dục", "Cách thức hoạt động phối hợp thống nhất của nhà giáo dục và người được giáo dục, tiến hành dưới vai trò chủ thể của người học", "Cách tổ chức, sắp xếp hoạt động giáo dục theo trật tự và chế độ nhất định nhằm thực hiện nhiệm vụ giáo dục"], "a": 1}, {"q": "Chương trình giáo dục phổ thông 2018 định hướng phương pháp giáo dục là:", "o": ["Giáo viên truyền thụ, học sinh ghi nhớ và vận dụng kiến thức qua hệ thống bài tập chuẩn", "Ưu tiên thuyết trình, giảng giải kết hợp đàm thoại để truyền đạt hệ thống tri thức", "Áp dụng các phương pháp tích cực hoá hoạt động của học sinh, giáo viên tổ chức, hướng dẫn hoạt động, tạo môi trường học tập thân thiện và tình huống có vấn đề", "Ứng dụng công nghệ thông tin và hệ thống tự động hoá kĩ thuật số làm phương pháp chủ đạo"], "a": 2}, {"q": "Các hoạt động học tập của học sinh theo định hướng Chương trình 2018 bao gồm:", "o": ["Hoạt động ghi nhớ, hoạt động luyện tập và hoạt động kiểm tra", "Hoạt động nghe giảng, hoạt động luyện tập và hoạt động thực hành", "Hoạt động khám phá vấn đề, hoạt động thi đua và hoạt động khen thưởng", "Hoạt động khám phá vấn đề, hoạt động luyện tập và hoạt động thực hành"], "a": 3}, {"q": "Các phương pháp giáo dục ở trường phổ thông được phân thành ba nhóm:", "o": ["Nhóm sử dụng ngôn ngữ; nhóm khám phá, thực hành, trải nghiệm; nhóm kích thích và điều chỉnh hoạt động của học sinh", "Nhóm sử dụng ngôn ngữ; nhóm quan sát, thực nghiệm; nhóm kích thích và điều chỉnh hoạt động của học sinh", "Nhóm sử dụng ngôn ngữ; nhóm khám phá, thực hành, trải nghiệm; nhóm kiểm tra và đánh giá kết quả học tập", "Nhóm trực quan; nhóm khám phá, thực hành, trải nghiệm; nhóm kích thích và điều chỉnh hoạt động của học sinh"], "a": 0}, {"q": "Mục đích cơ bản của nhóm phương pháp sử dụng ngôn ngữ là:", "o": ["Rèn luyện kĩ năng, kĩ xảo thông qua việc tổ chức học sinh thực hiện hành động thực tiễn", "Tác động trực tiếp đến nhận thức và tình cảm học sinh thông qua phân tích, so sánh, dẫn chứng, kết luận một vấn đề khoa học hay chuẩn mực giáo dục", "Kích thích khuynh hướng tự khẳng định và thúc đẩy học sinh cố gắng vươn lên trong tập thể", "Tổ chức học sinh khám phá, giải quyết vấn đề thực tiễn thông qua các nhiệm vụ học tập phức hợp"], "a": 1}, {"q": "Phương pháp thuyết trình – giảng giải là cách thức nhà giáo dục:", "o": ["Tổ chức cho học sinh tự lực tìm tòi, khám phá và giải quyết vấn đề học tập", "Tổ chức các nhóm nhỏ hợp tác nghiên cứu, trao đổi ý tưởng và giải quyết nhiệm vụ", "Dùng lời nói để trình bày, giải thích, chứng minh nội dung tri thức khoa học, giá trị, chuẩn mực xã hội đã quy định", "Dùng hệ thống câu hỏi trao đổi với học sinh để hình thành, củng cố nhận thức và niềm tin"], "a": 2}, {"q": "Trong phương pháp đàm thoại, nhà giáo dục đóng vai trò:", "o": ["Người quan sát, để học sinh tự trao đổi và tự rút ra kết luận cuối cùng", "Người đặt câu hỏi và trực tiếp trả lời, học sinh lắng nghe và ghi nhận", "Người điều phối, ghi nhận ý kiến của học sinh mà không đánh giá, kết luận", "Cố vấn, trọng tài khoa học định hướng học sinh suy nghĩ, phân tích, đánh giá tình huống và rút ra kết luận cuối cùng"], "a": 3}, {"q": "Nhóm phương pháp khám phá, thực hành, trải nghiệm gồm các phương pháp cụ thể:", "o": ["Giải quyết vấn đề; thực hành; hợp tác trong nhóm; tổ chức dự án", "Thuyết trình – giảng giải; đàm thoại; hợp tác trong nhóm; tổ chức dự án", "Giải quyết vấn đề; thực hành; thi đua; khen thưởng", "Giải quyết vấn đề; đàm thoại; thực hành; tổ chức dự án"], "a": 0}, {"q": "Trong phương pháp giải quyết vấn đề, “mâu thuẫn nhận thức” là mâu thuẫn giữa:", "o": ["Yêu cầu của giáo viên và khả năng thực hiện của học sinh khi giải quyết nhiệm vụ", "Những “cái đã biết” và những “cái chưa biết”, khiến học sinh muốn tìm tòi để giải quyết", "Lí thuyết đã học và thực hành, khiến học sinh muốn kiểm chứng điều đã biết", "Ý kiến của cá nhân và ý kiến của tập thể, khiến học sinh muốn thống nhất cách giải quyết"], "a": 1}, {"q": "Các bước của phương pháp giải quyết vấn đề theo thứ tự là:", "o": ["Nhận biết vấn đề – Tổ chức giải quyết – Lập kế hoạch giải quyết – Kiểm tra, đánh giá và kết luận", "Lập kế hoạch giải quyết – Nhận biết vấn đề – Tổ chức giải quyết – Kiểm tra, đánh giá và kết luận", "Nhận biết vấn đề – Lập kế hoạch giải quyết – Tổ chức giải quyết – Kiểm tra, đánh giá và kết luận", "Nhận biết vấn đề – Lập kế hoạch giải quyết – Kiểm tra, đánh giá – Tổ chức giải quyết và kết luận"], "a": 2}, {"q": "Phương pháp thực hành là cách thức tổ chức cho học sinh thực hiện các hành động, hoạt động thực hành, thực tiễn nhằm:", "o": ["Củng cố, hệ thống hoá tri thức lí thuyết đã lĩnh hội và ghi nhớ lâu dài", "Kiểm tra mức độ nắm vững kiến thức của học sinh sau mỗi bài học", "Kích thích tinh thần thi đua và khuynh hướng tự khẳng định của học sinh", "Hình thành, rèn luyện kĩ năng, kĩ xảo, phát triển năng lực vận dụng"], "a": 3}, {"q": "Đặc điểm cơ bản của phương pháp hợp tác trong nhóm là:", "o": ["Học sinh trong nhóm có trách nhiệm cá nhân và sự phụ thuộc, tương tác, hợp tác tích cực để giải quyết nhiệm vụ chung; thành công cá nhân góp phần tạo nên thành công của nhóm", "Học sinh trong nhóm có trách nhiệm cá nhân, tương tác tích cực; thành công của cá nhân quyết định thành công của nhóm", "Nhóm có số lượng thành viên linh hoạt, cố định suốt năm học để gắn bó và phát huy thế mạnh", "Học sinh có trình độ cao đóng vai trò chủ đạo, các thành viên còn lại hỗ trợ thực hiện nhiệm vụ"], "a": 0}, {"q": "Tiến trình phương pháp hợp tác trong nhóm gồm các bước:", "o": ["Tổ chức nhóm học tập – Tổ chức trình bày kết quả – Tổ chức đánh giá và kết luận của giáo viên", "Tổ chức nhóm học tập – Tổ chức hoạt động hợp tác trong nhóm – Tổ chức trình bày và đánh giá kết quả", "Nhận biết nhiệm vụ – Lập kế hoạch hợp tác – Thực hiện nhiệm vụ – Kiểm tra, đánh giá", "Chuẩn bị nhóm – Hợp tác thực hiện nhiệm vụ – Báo cáo và đánh giá kết quả dự án"], "a": 1}, {"q": "Các đặc điểm của phương pháp tổ chức dự án gồm:", "o": ["Định hướng thực tiễn, định hướng nội dung, định hướng sản phẩm", "Định hướng lí thuyết, định hướng học sinh, định hướng sản phẩm", "Định hướng thực tiễn, định hướng học sinh, định hướng sản phẩm", "Định hướng thực tiễn, định hướng học sinh, định hướng đánh giá"], "a": 2}, {"q": "Phương pháp tổ chức dự án tiến hành theo ba giai đoạn:", "o": ["Đề xuất ý tưởng – Thực hiện dự án – Báo cáo và đánh giá dự án", "Chuẩn bị dự án – Thực hiện dự án – Tổng kết và khen thưởng dự án", "Chuẩn bị dự án – Triển khai theo nhóm – Báo cáo và đánh giá dự án", "Chuẩn bị dự án – Thực hiện dự án – Báo cáo và đánh giá dự án"], "a": 3}, {"q": "Sản phẩm tạo ra ở giai đoạn chuẩn bị dự án (bước lập kế hoạch) là:", "o": ["Bản kế hoạch dự án", "Bản đề cương nội dung dự án", "Bản phân công nhiệm vụ của các nhóm", "Sản phẩm vật chất của dự án"], "a": 0}, {"q": "Trong phương pháp tổ chức dự án, nhà giáo dục chủ yếu đóng vai trò:", "o": ["Chỉ đạo, trực tiếp thực hiện các nhiệm vụ khó trong dự án", "Tư vấn, hướng dẫn, giúp đỡ học sinh trong quá trình thực hiện dự án", "Đánh giá, kiểm soát chặt chẽ từng bước thực hiện của học sinh", "Quyết định đề tài, nội dung và kế hoạch thực hiện dự án của nhóm"], "a": 1}, {"q": "Nhóm phương pháp kích thích và điều chỉnh hoạt động của học sinh gồm:", "o": ["Thuyết trình, đàm thoại, khen thưởng", "Giải quyết vấn đề, thi đua, trách phạt", "Thi đua, khen thưởng, trách phạt", "Thi đua, thực hành, khen thưởng"], "a": 2}, {"q": "Phương pháp thi đua nhằm:", "o": ["Kích thích khuynh hướng tự khẳng định của học sinh, thúc đẩy cố gắng của cá nhân; cần quan tâm hai giai đoạn: phát động và tổng kết", "Khẳng định, biểu dương thành tích của học sinh, củng cố niềm tin; cần quan tâm ba giai đoạn: phát động, tiến hành, tổng kết", "Biểu thị sự phê phán hành vi sai trái của học sinh, thúc đẩy vươn lên; cần quan tâm đủ ba giai đoạn", "Kích thích khuynh hướng tự khẳng định, thúc đẩy cố gắng cho cá nhân và tập thể; cần quan tâm đủ ba giai đoạn: phát động, tiến hành, tổng kết đánh giá"], "a": 3}, {"q": "Khi sử dụng phương pháp khen thưởng, nhà giáo dục cần đảm bảo:", "o": ["Dựa trên quá trình tiến bộ, hành vi thực tế; chú ý cả động cơ và phương thức đạt kết quả; công bằng, khách quan, kịp thời", "Dựa trên kết quả cuối cùng đạt được, chú ý mức độ đúng mực, công bằng và kịp thời", "Dựa trên thành tích nổi trội, chú ý động cơ và hình thức khen thưởng đa dạng", "Dựa trên quá trình tiến bộ của học sinh, ưu tiên các học sinh có thành tích xuất sắc"], "a": 0}, {"q": "Trách phạt là phương pháp giáo dục biểu thị:", "o": ["Sự đồng tình, ủng hộ những hành động, hành vi đúng đắn của học sinh so với yêu cầu đề ra", "Sự không đồng tình, phản đối, phê phán những hành động, hành vi sai trái của học sinh so với yêu cầu, mục tiêu đề ra", "Sự không hài lòng với kết quả học tập, rèn luyện của học sinh so với năng lực vốn có", "Sự răn đe, ngăn chặn những hành vi sai trái của học sinh bằng biện pháp xử phạt nghiêm khắc"], "a": 1}, {"q": "Không nên trách phạt thường xuyên vì:", "o": ["Làm học sinh mất tự tin và ngại tham gia hoạt động tập thể", "Làm giảm uy tín của nhà giáo dục trong mắt học sinh và phụ huynh", "Gây nên sức ì tâm lí ở học sinh và do đó không đạt hiệu quả giáo dục", "Làm mất thời gian dành cho hoạt động dạy học và giáo dục khác"], "a": 2}, {"q": "Cơ sở khoa học để lựa chọn và vận dụng các phương pháp giáo dục gồm:", "o": ["Mục tiêu, nội dung giáo dục; đặc điểm phương pháp; đặc điểm lứa tuổi và cá nhân học sinh; trình độ, năng lực, kinh nghiệm của nhà giáo dục; môi trường, tình huống, điều kiện cụ thể", "Mục tiêu, nội dung giáo dục; đặc điểm phương pháp; đặc điểm lứa tuổi và cá nhân học sinh; điều kiện cơ sở vật chất, thiết bị của nhà trường", "Mục tiêu giáo dục; đặc điểm phương pháp; trình độ, năng lực, kinh nghiệm của nhà giáo dục; sở thích của học sinh", "Mục tiêu, nội dung giáo dục; đặc điểm lứa tuổi và cá nhân học sinh; kết quả học tập của học sinh trong từng giai đoạn"], "a": 0}], "4": [{"q": "Giáo viên chủ nhiệm lớp ở trường phổ thông là:", "o": ["Giáo viên có thâm niên, uy tín và kinh nghiệm quản lí được Sở Giáo dục và Đào tạo chỉ định phụ trách một lớp", "Giáo viên có năng lực, uy tín và kinh nghiệm giáo dục được tổ chuyên môn đề cử để quản lí, giáo dục một lớp", "Giáo viên có năng lực, uy tín và kinh nghiệm giáo dục được hiệu trưởng lựa chọn để quản lí, giáo dục một lớp", "Giáo viên có uy tín được tập thể học sinh bầu chọn và được hiệu trưởng công nhận để phụ trách một lớp"], "a": 2}, {"q": "Giáo viên chủ nhiệm là người thay mặt ai để quản lí, giáo dục toàn diện học sinh một lớp?", "o": ["Phó hiệu trưởng phụ trách chuyên môn", "Hiệu trưởng nhà trường", "Tổng phụ trách Đội và Bí thư Đoàn trường", "Hội đồng trường"], "a": 1}, {"q": "Nội dung nào sau đây KHÔNG phải là chức năng của giáo viên chủ nhiệm lớp?", "o": ["Quản lí – giáo dục toàn diện học sinh một lớp học", "Cố vấn cho hoạt động tự quản của tập thể học sinh", "Làm cầu nối giữa tập thể học sinh với các lực lượng giáo dục trong nhà trường", "Thay mặt tập thể lớp quyết định kế hoạch giáo dục chung của toàn trường"], "a": 3}, {"q": "Giáo viên chủ nhiệm chịu trách nhiệm về công tác quản lí học sinh trước:", "o": ["Phòng Giáo dục và Đào tạo", "Hiệu trưởng nhà trường", "Ban đại diện cha mẹ học sinh", "Tổ trưởng chuyên môn"], "a": 1}, {"q": "Để thực hiện chức năng quản lí – giáo dục toàn diện học sinh, giáo viên chủ nhiệm phải:", "o": ["Xây dựng kế hoạch phát triển tập thể, tổ chức các hoạt động giáo dục, kiểm tra kết quả học tập các môn văn hoá của học sinh", "Xây dựng kế hoạch phát triển tập thể, tổ chức các hoạt động giáo dục, tự mình thực hiện thay học sinh các công việc của lớp", "Xây dựng kế hoạch, tổ chức hoạt động, đánh giá kết quả học tập và rèn luyện của học sinh mà không cần đánh giá sự phát triển của tập thể", "Xây dựng kế hoạch phát triển tập thể; tổ chức, chỉ đạo các hoạt động; kiểm tra, đánh giá kết quả học tập, rèn luyện của học sinh và sự phát triển của tập thể"], "a": 3}, {"q": "Mối quan hệ giữa quản lí và giáo dục trong công tác chủ nhiệm là:", "o": ["Bổ sung cho nhau nhưng được tiến hành độc lập ở hai giai đoạn khác nhau", "Thống nhất biện chứng, được tiến hành đồng thời trong toàn bộ quá trình chủ nhiệm", "Thống nhất với nhau nhưng giáo dục luôn phải đi trước quản lí", "Tách rời tương đối, quản lí trước rồi mới tiến hành giáo dục"], "a": 1}, {"q": "Chức năng đặc trưng của giáo viên chủ nhiệm là:", "o": ["Quản lí – giáo dục toàn diện học sinh một lớp học", "Đại diện nhà trường truyền đạt kế hoạch giáo dục đến học sinh", "Cố vấn cho hoạt động tự quản của tập thể học sinh", "Tổ chức phối hợp các lực lượng giáo dục ngoài nhà trường"], "a": 2}, {"q": "Với tư cách là cố vấn cho hoạt động tự quản, giáo viên chủ nhiệm:", "o": ["Định hướng, hướng dẫn, hỗ trợ, tư vấn để học sinh tự làm; không làm thay, cũng không “khoán trắng” hay thả lỏng", "Định hướng, hướng dẫn và trực tiếp điều hành công việc của lớp để bảo đảm tiến độ, nhưng không làm thay từng em", "Giao toàn quyền cho cán bộ lớp tự quyết định, chỉ can thiệp khi lớp xảy ra vi phạm nghiêm trọng", "Trực tiếp tổ chức hoạt động của lớp, học sinh tham gia thực hiện theo kế hoạch đã được giáo viên xây dựng"], "a": 0}, {"q": "Điều kiện quan trọng để giáo viên chủ nhiệm thực hiện tốt chức năng cố vấn là:", "o": ["Có nhiều năm kinh nghiệm giảng dạy và được học sinh yêu mến, tin tưởng", "Có sự giám sát thường xuyên của ban đại diện cha mẹ học sinh và tổ chức Đoàn, Đội", "Được nhà trường bảo đảm đủ cơ sở vật chất và thời gian để tổ chức hoạt động", "Xây dựng được đội ngũ cán bộ lớp có năng lực, bồi dưỡng phần tử tích cực và phát huy sức mạnh tự quản của tập thể"], "a": 3}, {"q": "Để thực hiện chức năng cố vấn, giáo viên chủ nhiệm cần:", "o": ["Hiểu lí luận tập thể, có kĩ năng bồi dưỡng đội ngũ tự quản, dự báo chính xác khả năng học sinh, luôn yêu cầu cao về tính tự quản, chủ động", "Hiểu lí luận tập thể, nắm vững kiến thức bộ môn, có kĩ năng bồi dưỡng đội ngũ tự quản và trực tiếp điều hành mọi hoạt động của lớp", "Hiểu vai trò của tập thể, có kĩ năng quản lí hành chính, biết lập sổ sách để theo dõi và kiểm soát chặt chẽ từng học sinh", "Có uy tín cá nhân, nắm vững kiến thức bộ môn, biết giao việc và luôn kiểm tra trực tiếp mọi việc của cán bộ lớp"], "a": 0}, {"q": "Chức năng “cầu nối” giữa tập thể học sinh với các lực lượng giáo dục trong nhà trường thể hiện ở hai vai trò:", "o": ["Đại diện cho hiệu trưởng và đại diện cho Sở Giáo dục", "Đại diện cho cha mẹ học sinh và đại diện cho học sinh", "Đại diện cho nhà trường và đại diện cho giáo viên bộ môn", "Đại diện cho nhà trường và đại diện cho học sinh, tập thể học sinh"], "a": 3}, {"q": "Với tư cách là người đại diện cho nhà trường, giáo viên chủ nhiệm cần:", "o": ["Truyền đạt yêu cầu của nhà trường, thuyết phục lớp thực hiện đầy đủ và đặt chỉ tiêu cao để lớp đạt thành tích tốt", "Truyền đạt chủ trương, kế hoạch của nhà trường nhưng để lớp tự chọn giải pháp, không cần gợi ý hay hướng dẫn", "Truyền đạt chủ trương, yêu cầu, kế hoạch của nhà trường; gợi ý giải pháp vừa đảm bảo yêu cầu chung vừa phù hợp khả năng của lớp, tránh gây áp lực và chạy theo thành tích", "Truyền đạt kế hoạch của nhà trường và báo cáo kết quả thực hiện, việc lựa chọn giải pháp thuộc về nhà trường"], "a": 2}, {"q": "Với tư cách là người đại diện cho học sinh và tập thể học sinh, giáo viên chủ nhiệm có trách nhiệm:", "o": ["Thay mặt học sinh đưa ra quyết định về các vấn đề của lớp sau khi đã lắng nghe ý kiến của các em", "Lắng nghe, tập hợp ý kiến, nguyện vọng của học sinh để phản ánh với ban giám hiệu; bảo vệ quyền lợi chính đáng của học sinh", "Lắng nghe ý kiến của học sinh, chọn lọc những ý kiến phù hợp với chủ trương nhà trường để phản ánh với ban giám hiệu", "Chỉ phản ánh với ban giám hiệu những ý kiến của cán bộ lớp và bảo vệ quyền lợi chung của cả tập thể lớp"], "a": 1}, {"q": "Để làm tốt chức năng “cầu nối”, giáo viên chủ nhiệm cần:", "o": ["Có trách nhiệm cao, năng lực thuyết phục, khả năng thiết lập quan hệ tốt với các lực lượng giáo dục, biết giữ gìn uy tín, có ý chí vượt khó", "Có trách nhiệm cao, say sưa với nghề, chuyên môn giỏi và chấp hành nghiêm mệnh lệnh của cấp trên", "Có trách nhiệm cao, biết tránh va chạm với các lực lượng giáo dục để giữ gìn uy tín và sự hoà thuận", "Có năng lực thuyết phục, chuyên môn vững vàng, kiên trì áp dụng nhất quán phương pháp của bản thân"], "a": 0}, {"q": "Việc phối hợp các lực lượng giáo dục ngoài nhà trường (gia đình, đoàn thể xã hội, cộng đồng dân cư...) là:", "o": ["Một nguyên tắc quản lí nhà trường, thuộc trách nhiệm riêng của hiệu trưởng", "Một biện pháp bổ trợ, chỉ cần thiết với những học sinh cá biệt", "Một nguyên tắc giáo dục, đồng thời là một trong những nội dung thực hiện xã hội hoá giáo dục", "Một nội dung xã hội hoá giáo dục, thực hiện tuỳ theo điều kiện của từng lớp"], "a": 2}, {"q": "Hình thức phối hợp của giáo viên chủ nhiệm với cha mẹ học sinh KHÔNG bao gồm:", "o": ["Hội nghị cha mẹ học sinh định kì", "Phiếu liên lạc, tiếp xúc riêng", "Họp ban đại diện cha mẹ học sinh để thay giáo viên đánh giá học sinh", "Trao đổi thông tin qua phương tiện liên lạc, công nghệ"], "a": 2}, {"q": "Đối với ban đại diện cha mẹ học sinh lớp, giáo viên chủ nhiệm:", "o": ["Phối hợp khi cần huy động kinh phí, không định hướng nội dung hoạt động", "Giao toàn quyền điều hành để ban đại diện chủ động trong mọi hoạt động", "Chỉ làm việc với ban đại diện khi học sinh có vi phạm", "Phát huy vai trò và định hướng cho ban đại diện hoạt động"], "a": 3}, {"q": "Theo Điều lệ trường tiểu học (2020), nhiệm vụ của giáo viên chủ nhiệm KHÔNG bao gồm:", "o": ["Chủ động nắm bắt thông tin từng học sinh của lớp được phân công chủ nhiệm", "Tự phê duyệt kế hoạch hoạt động giáo dục của lớp mình chủ nhiệm trước khi thực hiện", "Phối hợp chặt chẽ với cha mẹ học sinh, giáo viên, tổng phụ trách Đội, các tổ chức xã hội có liên quan", "Báo cáo thường kì hoặc đột xuất về tình hình của lớp với hiệu trưởng"], "a": 1}, {"q": "Theo Điều lệ trường tiểu học, giáo viên chủ nhiệm thực hiện các hoạt động giáo dục theo kế hoạch đã xây dựng và:", "o": ["Được hiệu trưởng phê duyệt", "Được Phòng Giáo dục và Đào tạo phê duyệt", "Được tổ chuyên môn thông qua", "Được Hội đồng trường phê duyệt"], "a": 0}, {"q": "Theo Điều lệ trường tiểu học, giáo viên chủ nhiệm tổng hợp nhận xét, đánh giá học sinh vào thời điểm:", "o": ["Giữa kì I và cuối năm học", "Cuối kì I và cuối năm học", "Cuối mỗi tháng và cuối năm học", "Đầu năm học và cuối kì II"], "a": 1}, {"q": "Theo Điều lệ trường tiểu học, giáo viên chủ nhiệm báo cáo thường kì hoặc đột xuất về tình hình của lớp với:", "o": ["Phòng Giáo dục và Đào tạo", "Tổng phụ trách Đội", "Hiệu trưởng", "Ban đại diện cha mẹ học sinh"], "a": 2}, {"q": "Theo Điều lệ trường THCS và THPT (2020), giáo viên chủ nhiệm phối hợp với:", "o": ["Đội Thiếu niên Tiền phong Hồ Chí Minh, Đoàn Thanh niên Cộng sản Hồ Chí Minh, Hội Liên hiệp Thanh niên Việt Nam, gia đình học sinh và các tổ chức xã hội liên quan", "Đội Thiếu niên Tiền phong Hồ Chí Minh, Đoàn Thanh niên Cộng sản Hồ Chí Minh, gia đình học sinh và các tổ chức xã hội liên quan", "Đoàn Thanh niên Cộng sản Hồ Chí Minh, Hội Liên hiệp Thanh niên Việt Nam, Hội Liên hiệp Phụ nữ và gia đình học sinh", "Đội Thiếu niên Tiền phong Hồ Chí Minh, Hội Liên hiệp Thanh niên Việt Nam, gia đình học sinh và chính quyền địa phương"], "a": 0}, {"q": "Theo Điều lệ trường THCS và THPT (2020), giáo viên chủ nhiệm còn có nhiệm vụ:", "o": ["Tham gia công tác phổ cập giáo dục trung học phổ thông ở địa phương; học tập, rèn luyện nâng cao trình độ chuyên môn", "Tham gia công tác tuyển sinh đầu cấp ở địa phương; học tập, rèn luyện nâng cao trình độ chuyên môn", "Tham gia công tác phổ cập giáo dục trung học cơ sở ở địa phương; học tập, rèn luyện nâng cao trình độ, đổi mới phương pháp dạy học, giáo dục", "Tham gia quản lí tài chính, tài sản của nhà trường; học tập, rèn luyện nâng cao trình độ chuyên môn"], "a": 2}, {"q": "Việc tìm hiểu và nắm vững đối tượng giáo dục là:", "o": ["Vừa là nội dung, vừa là điều kiện để làm tốt công tác giáo dục", "Chỉ là điều kiện để làm tốt công tác giáo dục, không phải nội dung của công tác chủ nhiệm", "Nội dung công việc chủ yếu của giai đoạn đầu năm học, sau đó chỉ bổ sung khi cần", "Công việc của giáo viên bộ môn, giáo viên chủ nhiệm chỉ tham khảo kết quả"], "a": 0}, {"q": "Nội dung nào thuộc việc tìm hiểu tập thể học sinh?", "o": ["Đặc điểm tâm sinh lí, năng lực, sở thích và nguyện vọng của từng học sinh trong lớp", "Trình độ phát triển, truyền thống, bầu không khí, sở thích, năng khiếu và nguyện vọng của từng học sinh", "Trình độ phát triển, truyền thống, bầu không khí, các mối quan hệ, nhóm tự phát, thủ lĩnh tự phát, mặt mạnh, mặt yếu", "Hoàn cảnh sống, sức khoẻ, tính cách của từng học sinh và mối quan hệ với gia đình"], "a": 2}, {"q": "Nội dung nào thuộc việc tìm hiểu cá nhân học sinh?", "o": ["Đặc điểm tâm sinh lí, tính cách, năng lực, sở thích, truyền thống và bầu không khí của lớp", "Đặc điểm tâm sinh lí, tính cách, năng lực, sở thích, hoàn cảnh sống, quan hệ với tập thể, bè bạn", "Đặc điểm tâm sinh lí, hoàn cảnh sống, sự phân hoá nhóm tự phát và thủ lĩnh tự phát", "Tính cách, năng lực, sở thích, trình độ phát triển và mặt mạnh, mặt yếu của tập thể"], "a": 1}, {"q": "Cách thức tìm hiểu học sinh KHÔNG bao gồm:", "o": ["Nghiên cứu hồ sơ học sinh (lí lịch, học bạ, sổ liên lạc)", "Trao đổi với học sinh, bạn bè, giáo viên bộ môn, cha mẹ học sinh", "Suy đoán dựa trên hạnh kiểm năm học trước mà không đối chiếu thêm nguồn thông tin khác", "Nghiên cứu sản phẩm hoạt động của học sinh như bài làm, báo tường, nhật kí"], "a": 2}, {"q": "Việc tìm hiểu học sinh là công việc:", "o": ["Chủ yếu làm ở đầu năm học, sau đó chỉ bổ sung khi học sinh có vi phạm", "Có thời hạn, hoàn thành trong tuần đầu nhận lớp rồi cập nhật vào cuối kì", "Làm theo từng học kì, tạm dừng trong thời gian giữa hai học kì", "Thường xuyên, liên tục trong suốt năm học"], "a": 3}, {"q": "Khi tìm hiểu học sinh, giáo viên chủ nhiệm cần tránh:", "o": ["Ghi chép, lưu giữ và đối chiếu thông tin thu thập từ nhiều nguồn", "Phân tích nguyên nhân của các hiện trạng trước khi tìm biện pháp giáo dục", "Kết luận nhanh, thiên vị, cảm tính, chủ quan khi đánh giá học sinh", "Phối hợp nhiều cách thức tìm hiểu để có “bức tranh chung” có hệ thống"], "a": 2}, {"q": "Việc phân loại học sinh theo nhiều tiêu chí khác nhau (học lực, hạnh kiểm, nguyên nhân, quan hệ xã hội, tính cách, đối tượng đặc biệt...) nhằm:", "o": ["Có kế hoạch theo dõi, tác động phù hợp với từng nhóm đối tượng học sinh", "Xếp hạng học sinh để phục vụ công tác thi đua, khen thưởng", "Chọn ra các học sinh giỏi để tập trung bồi dưỡng", "Tách riêng học sinh yếu để tổ chức phụ đạo"], "a": 0}, {"q": "Kế hoạch giáo dục của lớp chủ nhiệm là:", "o": ["Danh mục các hoạt động của lớp trong năm học do ban cán sự lập để theo dõi tiến độ thực hiện", "Bản thiết kế chung nội dung giảng dạy các môn học của lớp trong một học kì", "Bản dự kiến thi đua, khen thưởng học sinh trong một giai đoạn cụ thể của năm học", "Bản thiết kế cụ thể toàn bộ nội dung hoạt động giáo dục của lớp, là chương trình hành động thực thi của lớp trong một giai đoạn cụ thể"], "a": 3}, {"q": "Ý nghĩa của kế hoạch giáo dục đối với giáo viên chủ nhiệm KHÔNG bao gồm:", "o": ["Giúp lớp chủ nhiệm chủ động đề ra mục tiêu riêng, độc lập với kế hoạch giáo dục của nhà trường", "Làm cho hoạt động được thực hiện theo một chương trình cụ thể, thống nhất", "Giúp giáo viên và học sinh chủ động, tiết kiệm thời gian, công sức", "Tạo sự thống nhất và huy động sức mạnh tổng hợp của các lực lượng giáo dục"], "a": 0}, {"q": "Căn cứ để xây dựng kế hoạch giáo dục KHÔNG bao gồm:", "o": ["Mục tiêu, nhiệm vụ, kế hoạch giáo dục của nhà trường", "Sở thích và thế mạnh riêng của giáo viên chủ nhiệm đối với một số mảng hoạt động", "Dự báo của giáo viên chủ nhiệm về khả năng phát triển từng mặt của lớp", "Đặc điểm tình hình của địa phương"], "a": 1}, {"q": "Tính toàn diện của kế hoạch giáo dục là:", "o": ["Đề cập tất cả các nội dung giáo dục toàn diện cho học sinh, không xem nhẹ một nội dung nào", "Mô tả chi tiết từng hoạt động, thời gian, nội dung công việc, lực lượng tham gia và dự kiến kết quả", "Nhấn mạnh hoạt động trọng tâm tuỳ theo từng thời gian và từng lớp", "Phân bổ thời gian đồng đều cho mọi nội dung giáo dục trong kế hoạch"], "a": 0}, {"q": "Tính cụ thể của kế hoạch giáo dục thể hiện ở:", "o": ["Đề cập tất cả các nội dung giáo dục toàn diện cho học sinh", "Nhấn mạnh hoạt động trọng tâm tuỳ từng thời gian, từng lớp", "Xác định rõ mục tiêu chung, chỉ tiêu cao và hướng phấn đấu của lớp", "Từng hoạt động, yêu cầu, thời gian, nội dung công việc, biện pháp tiến hành, lực lượng tham gia, dự kiến kết quả"], "a": 3}, {"q": "Tính trọng tâm của kế hoạch giáo dục là:", "o": ["Đề cập đầy đủ mọi nội dung giáo dục, không xem nhẹ nội dung nào", "Tuỳ từng thời gian, từng lớp mà nhấn mạnh hoạt động trọng tâm nào", "Mô tả chi tiết từng hoạt động cùng thời gian, biện pháp và lực lượng tham gia", "Phân bổ thời gian như nhau cho mọi nội dung để đảm bảo tính công bằng"], "a": 1}, {"q": "Bước đầu tiên trong xây dựng kế hoạch giáo dục của lớp chủ nhiệm là:", "o": ["Xác định mục tiêu, chỉ tiêu cần đạt", "Xây dựng nội dung hoạt động giáo dục cụ thể", "Phân tích, đánh giá tình hình, đặc điểm lớp học", "Phân công lực lượng tham gia, thể hiện tiến độ thực hiện"], "a": 2}, {"q": "Bước thứ hai trong xây dựng kế hoạch giáo dục là:", "o": [ function persist(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(weak)); localStorage.setItem(LS_AUTO,autoSave?'1':'0'); }catch(e){}
}

let mode='quiz';            // 'quiz' = làm bài, 'weak' = câu hay sai
let cur=1, order=[], state={}, curIdx=-1;
const SESS={};
const skey=()=>mode+cur;

function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function mkQ(c,i){
  const q=CH[c][i];
  return {id:i,text:q.q,opts:q.o.map((t,k)=>({t,ok:k===q.a}))};
}

function build(doShuffle){
  state={};
  let qs = mode==='quiz' ? CH[cur].map((_,i)=>mkQ(cur,i)) : weak[cur].map(i=>mkQ(cur,i));
  if(doShuffle){ shuffleArr(qs); qs.forEach(q=>shuffleArr(q.opts)); }
  order=qs;
  SESS[skey()]={order,state};
  render();
}

function setStar(b,saved){
  b.className='star'+(saved?' on':'');
  b.textContent = saved ? '★ Đã lưu vào câu hay sai' : '☆ Lưu vào câu hay sai';
}

function render(){
  document.body.classList.toggle('weak', mode==='weak');
  const list=document.getElementById('list'), nav=document.getElementById('nav');
  list.innerHTML=''; nav.innerHTML='';
  if(mode==='weak' && order.length===0){
    const d=document.createElement('div'); d.className='empty';
    d.innerHTML='<div class="big">⭐</div><b>Chưa có câu nào trong mục này ('+NAMES[cur]+')</b><br>'+
      'Hãy qua mục <b>Làm bài</b> và bấm <b>☆ Lưu vào câu hay sai</b> ở những câu bạn hay nhầm, '+
      'hoặc bật <b>Tự lưu câu làm sai</b> ở thanh trên.';
    list.appendChild(d);
  }
  order.forEach((q,idx)=>{
    const a=document.createElement('a'); a.href='#q'+idx; a.textContent=idx+1; a.id='n'+idx; nav.appendChild(a);
    const box=document.createElement('div'); box.className='q'; box.id='q'+idx;
    const h=document.createElement('h3'); h.innerHTML='<span>Câu '+(idx+1)+'.</span> '; h.append(q.text);
    if(mode==='weak'){
      const t=document.createElement('small'); t.className='tag'; t.textContent=' (câu gốc số '+(q.id+1)+')'; h.appendChild(t);
    }
    box.appendChild(h);
    q.opts.forEach((o,k)=>{
      const b=document.createElement('button'); b.className='opt';
      b.innerHTML='<span class="k">'+'ABCD'[k]+'</span><span></span>';
      b.lastChild.textContent=o.t;
      b.onclick=()=>choose(idx,k);
      box.appendChild(b);
    });
    const fb=document.createElement('div'); fb.className='fb'; box.appendChild(fb);
    const acts=document.createElement('div'); acts.className='acts';
    if(mode==='quiz'){
      const s=document.createElement('button');
      setStar(s, weak[cur].includes(q.id));
      s.onclick=()=>toggleSaved(idx,s);
      acts.appendChild(s);
    }else{
      const d=document.createElement('button'); d.className='del';
      d.textContent='✓ Đã nhớ – xoá khỏi danh sách';
      d.onclick=()=>removeWeak(idx);
      acts.appendChild(d);
    }
    box.appendChild(acts);
    list.appendChild(box);
    if(state[idx]!==undefined) applyChoice(idx,state[idx]);
  });
  update();
  curIdx=-1; markCurrent();
}

function applyChoice(idx,k){
  const q=order[idx], box=document.getElementById('q'+idx);
  const btns=box.querySelectorAll('.opt');
  btns.forEach((b,i)=>{ b.disabled=true; if(q.opts[i].ok) b.classList.add('correct'); });
  const fb=box.querySelector('.fb');
  if(q.opts[k].ok){
    fb.innerHTML='<b class="ok-t">✔ Chính xác!</b>';
  }else{
    btns[k].classList.add('wrong');
    const right=q.opts.findIndex(o=>o.ok);
    fb.innerHTML='<b class="bad-t">✘ Chưa đúng.</b> Đáp án đúng: '+'ABCD'[right];
  }
  document.getElementById('n'+idx).classList.add(q.opts[k].ok?'ok':'bad');
}

function choose(idx,k){
  if(state[idx]!==undefined) return;
  state[idx]=k;
  applyChoice(idx,k);
  if(mode==='quiz' && autoSave && !order[idx].opts[k].ok && !weak[cur].includes(order[idx].id)){
    weak[cur].push(order[idx].id); persist();
    const s=document.querySelector('#q'+idx+' .star'); if(s) setStar(s,true);
  }
  update();
}

function toggleSaved(idx,btn){
  const id=order[idx].id, l=weak[cur], p=l.indexOf(id);
  if(p>=0) l.splice(p,1); else l.push(id);
  persist();
  setStar(btn, p<0);
  update();
}

function removeWeak(idx){
  const id=order[idx].id;
  weak[cur]=weak[cur].filter(x=>x!==id);
  persist();
  order.splice(idx,1);
  const ns={};
  for(const i in state){ const n=+i; if(n<idx) ns[n]=state[n]; else if(n>idx) ns[n-1]=state[n]; }
  state=ns;
  SESS[skey()]={order,state};
  render();
}

function buildTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  [1,2,3,4].forEach(c=>{
    const b=document.createElement('button'); b.className='tab'; b.id='tab'+c;
    b.onclick=()=>switchTab(c);
    t.appendChild(b);
  });
}

function updateTabs(){
  [1,2,3,4].forEach(c=>{
    const b=document.getElementById('tab'+c);
    if(mode==='quiz'){
      const done = c===cur ? Object.keys(state).length : (SESS['quiz'+c]?Object.keys(SESS['quiz'+c].state).length:0);
      const total = CH[c].length;
      b.className='tab'+(c===cur?' active':'')+(done===total?' full':'');
      b.innerHTML=NAMES[c]+' <small>'+done+'/'+total+'</small>';
    }else{
      b.className='tab'+(c===cur?' active':'');
      b.innerHTML=NAMES[c]+' <small>'+weak[c].length+' câu hay sai</small>';
    }
  });
}

function updateModes(){
  const n=[1,2,3,4].reduce((s,c)=>s+weak[c].length,0);
  const q=document.getElementById('mode-quiz'), w=document.getElementById('mode-weak');
  q.className='mode'+(mode==='quiz'?' active':'');
  w.className='mode'+(mode==='weak'?' active':'');
  q.textContent='📘 Làm bài';
  w.innerHTML='⭐ Câu hay sai <span class="badge">'+n+'</span>';
}

function update(){
  const total=order.length, done=Object.keys(state).length;
  let right=0; for(const i in state){ if(order[i].opts[state[i]].ok) right++; }
  document.getElementById('total').textContent=total;
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('wrong').textContent=done-right;
  document.getElementById('pbar').style.width=(total?done/total*100:0)+'%';
  document.getElementById('sub').textContent = mode==='quiz' ? SUBS[cur] : '⭐ Câu hay sai · '+NAMES[cur];
  const r=document.getElementById('result');
  if(total>0 && done===total){
    const pct=Math.round(right/total*100);
    document.getElementById('rtitle').textContent=(mode==='weak'?'Ôn câu hay sai – ':'')+NAMES[cur]+' – Kết quả: '+right+'/'+total+' ('+pct+'%)';
    document.getElementById('rtext').textContent = mode==='weak'
      ? 'Câu nào đã nhớ rồi thì bấm “Đã nhớ – xoá khỏi danh sách”, câu chưa nhớ cứ để lại ôn tiếp.'
      : (pct>=80?'Rất tốt! Bạn nắm vững nội dung.':
         pct>=50?'Khá ổn, hãy xem lại các câu sai (màu đỏ ở bảng số câu) rồi làm lại.':
         'Hãy đọc lại giáo trình và thử lại nhé!');
    r.style.display='block';
  } else r.style.display='none';
  updateTabs(); updateModes();
}

function loadSession(){
  if(mode==='quiz' && SESS['quiz'+cur]){ order=SESS['quiz'+cur].order; state=SESS['quiz'+cur].state; render(); }
  else build(false);               // mục câu hay sai luôn lấy danh sách mới nhất
}
function switchTab(c){
  if(c===cur) return;
  SESS[skey()]={order,state};
  cur=c; loadSession();
  window.scrollTo({top:0,behavior:'smooth'});
}
function setMode(m){
  if(m===mode) return;
  SESS[skey()]={order,state};
  mode=m; loadSession();
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetQuiz(shuf){ build(shuf); window.scrollTo({top:0,behavior:'smooth'}); }
document.getElementById('reset').onclick=()=>resetQuiz(false);
document.getElementById('shuffle').onclick=()=>resetQuiz(true);
document.getElementById('mode-quiz').onclick=()=>setMode('quiz');
document.getElementById('mode-weak').onclick=()=>setMode('weak');
const autoBox=document.getElementById('auto');
autoBox.checked=autoSave;
autoBox.onchange=()=>{ autoSave=autoBox.checked; persist(); };

function setBarH(){const b=document.querySelector('.bar');document.documentElement.style.setProperty('--barh',b.offsetHeight+'px');}
window.addEventListener('resize',setBarH);

function markCurrent(){
  const line=window.innerHeight*0.35; let found=0;
  document.querySelectorAll('.q').forEach((el,i)=>{ if(el.getBoundingClientRect().top<=line) found=i; });
  if(found!==curIdx){
    const old=document.getElementById('n'+curIdx); if(old) old.classList.remove('cur');
    const n=document.getElementById('n'+found); if(n){ n.classList.add('cur');
      const nav=document.getElementById('nav');
      if(nav.scrollWidth>nav.clientWidth) nav.scrollTo({left:n.offsetLeft-nav.clientWidth/2,behavior:'smooth'});
      else if(nav.scrollHeight>nav.clientHeight) nav.scrollTo({top:n.offsetTop-nav.clientHeight/2,behavior:'smooth'}); }
    curIdx=found;
  }
}
window.addEventListener('scroll',markCurrent,{passive:true});
document.getElementById('nav').addEventListener('click',e=>{
  const a=e.target.closest('a'); if(!a) return; e.preventDefault();
  document.getElementById('q'+a.id.slice(1)).scrollIntoView({behavior:'smooth',block:'start'});
});

buildTabs();
build(false);
setBarH();
</script>
</body>
</html>
